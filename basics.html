     <main>

        <h2>decision logic</h2>

        <h2>loops</h2>
   
    </main>

    <!-- when you want to use javascript code, use script tags -->
    <script>

        // single line comment
        /* multi line comment */

        //lets us create our first variable, which is a piece of info the program stores
        //camelCase
        //var is less concerned with scope
        var firstName = "monke"; //this is a string variable

        //snake_case
        //let is very concerned with scope
        let first_name = "monke"; //this is also a string variable

        //javascript is dynamically-typed language
        //javascript tries to guess what the data type of your variables is
        let age = 5; //javascript will assume this is an integer (int), just a whole number

        let pi = 3.14; //javascript will assume this is a float, just numbers with decimals

        let validInput = false; //javascript will assume this is a boolean, true/false

        let last_Name = ""; //set up the variable now, and get the value later

        //a valid way to set up a variable in javascript
        //do not set up variables without let or var in javascript
        middle_Name = "fartknocker";

        /* ****** is/else - decision logic ****** */

        //if statements test out the consition and are true of false, if true the inside {} will run
        //== is equality / are the values on both sides are the same
        //= is assignment, the value on the left side of the = will become the value on the right side
        //=== is where javascript will compare both the value and the data type
        if (age == 5){
            //if the age is 5, then do some function
            console.log("age is 5");
        }
        else if(age == 18){
            console.log("age is 18 - you are an adult");
        }
        else if(age == 25){
            console.log("age is 25 - car renting is now cheaper");
        }
        //the else is a catch all
        else{
            console.log("age is not 5");
        }


        function addNumbers(num1, num2){
            return num1 + num2;
        }

        // loops let us run chunks of code over and over
        // good for working with data displaying information
        // for loops - loop that runs a set number of times
        // while loop - loop that runs an undetermined number of times

        // for loop, i is the uhh variable/counter, then set condition that has tp be true for the loop to run, lastly increase value of i (++ means just adding 1 to i, i+1)
        for (let i = 0; i < 5; i++){
            console.log("i=" + i);
        }

        // set up variable that the while loop will test
        let exit = "no";
        // while loop, works great with user input, then can run either 0 times, a random number of times, or an infinite number of times
        while (exit != "yes"){
            console.log("test uhhh infinite loop");
            // change condition that is being tested to get out of infinite loop
            exit = "yes";
        }

        // do while loop, it runs at least 1 time
        do{
            // do something here
            console.log("do while loop");
        }while(exit != "yes");
    </script>
