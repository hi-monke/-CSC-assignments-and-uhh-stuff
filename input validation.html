 <center>

    <main>
        <br>
        <br>
        <!-- form - best option to use for testing if needed, action is the name of the page that the form will post to -->
        <form method="post" action="#" name="formInput" id="formInput" onsubmit="return false;">
            <!-- use label to explain what info you want the user to enter into the text box -->
            <label for="txtFirstName">First Name: </label>
            <!-- specify type of text when setting up a textbox to reduce issues later -->
            <input type="text" name="txtFirstName" id="txtFirstName" placeholder="ur first name here">
            <br>
            <br>
            <!-- get users last name -->
            <label for="txtLastName">Last Name: </label>
            <input type="text" name="txtLastName" id="txtLastName" placeholder="ur last name here">
            <br>
            <br>
            <!-- get users favorite color -->
            <label for="txtFavColor">Favorite Color: </label>
            <input type="color" name="txtFavColor" id="txtFavColor" placeholder="ur favorite color here">            
            <br>
            <br>
            <!-- get users birthday -->
            <label for="txtBirthDate">Birthday: </label>
            <input type="text" name="txtBirthDate" id="txtBirthDate" placeholder="mm/dd/yyyy">
            <br>
            <br>
            <!-- get users zip -->
            <label for="txtZipCode">Zip Code: </label>
            <input type="text" name="txtZipCode" id="txtZipCode" placeholder="xxxxx">
            <br>
            <br>
            <br>
            <button onclick="validateForm();">Save Inputs</button>
            <br>
            <br>
            <!-- create div to hold validation messages from the validation -->
            <div id="divMessage"></div>
        </form>
